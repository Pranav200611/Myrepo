
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legito — OIML R76 Calibration Management</title>
<style>
:root{
  --ink:#101820;
  --ink-soft:#3a4652;
  --line:#d7dde2;
  --line-soft:#e8ecef;
  --bg:#f3f5f6;
  --panel:#ffffff;
  --steel:#2f6690;
  --steel-dark:#1f4a68;
  --amber:#b8791a;
  --amber-bg:#fbf1de;
  --green:#1f7a4d;
  --green-bg:#e7f4ec;
  --red:#b3392c;
  --red-bg:#fbeae7;
  --gray-bg:#eef1f2;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--sans); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px;}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-0.01em;}
table{border-collapse:collapse; width:100%;}
::selection{background:#c9def0;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#101820 0%,#1c2b38 100%);
}
.login-card{
  width:380px; background:var(--panel); border-radius:2px; padding:36px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.login-brand{display:flex; align-items:baseline; gap:8px; margin-bottom:4px;}
.login-brand .mark{width:10px;height:10px;background:var(--steel);display:inline-block;}
.login-brand h1{font-size:19px;}
.login-sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:26px; border-bottom:1px solid var(--line-soft); padding-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
.field input,.field select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:2px; background:#fff;}
.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--steel); outline-offset:1px; border-color:var(--steel);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:2px; border:1px solid var(--steel-dark);
  background:var(--steel); color:#fff; font-size:13.5px; font-weight:500; cursor:pointer;
}
.btn:hover{background:var(--steel-dark);}
.btn.secondary{background:#fff; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{background:var(--gray-bg);}
.btn.danger{background:var(--red); border-color:#8f2c21;}
.btn.danger:hover{background:#8f2c21;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.login-error{color:var(--red); font-size:12.5px; margin-top:10px; min-height:14px;}
.login-hint{margin-top:18px; font-size:11.5px; color:#8a97a1; line-height:1.6; border-top:1px solid var(--line-soft); padding-top:14px;}

/* ---------- App shell ---------- */
#app{display:none; min-height:100vh; grid-template-columns:220px 1fr;}
#app.active{display:grid;}
.sidebar{background:var(--ink); color:#cdd6dc; padding:0; display:flex; flex-direction:column;}
.side-brand{padding:20px 18px; border-bottom:1px solid #24313c; display:flex; align-items:center; gap:8px;}
.side-brand .mark{width:9px;height:9px;background:#4d94c4;}
.side-brand span{color:#fff; font-weight:600; font-size:15px;}
.side-nav{flex:1; padding:10px 0; overflow-y:auto;}
.side-nav a{
  display:flex; align-items:center; gap:10px; padding:9px 18px; color:#aebac2; text-decoration:none; font-size:13.5px;
  border-left:3px solid transparent; cursor:pointer;
}
.side-nav a:hover{background:#182430; color:#fff;}
.side-nav a.active{background:#182430; color:#fff; border-left-color:#4d94c4;}
.side-nav .grp{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#5c6b76; padding:16px 18px 6px;}
.side-user{padding:14px 18px; border-top:1px solid #24313c; font-size:12.5px;}
.side-user .u-name{color:#fff; font-weight:600;}
.side-user .u-role{color:#8a97a1; font-size:11.5px; margin-top:1px;}
.side-user button{margin-top:10px; width:100%; background:transparent; border:1px solid #3a4650; color:#cdd6dc; padding:6px; border-radius:2px; cursor:pointer; font-size:12px;}
.side-user button:hover{background:#182430;}

.main{padding:26px 34px 60px; overflow-x:hidden; max-width:1180px;}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-head .sub{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}
.page-head .actions{display:flex; gap:8px;}

.panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:2px; padding:20px; margin-bottom:18px;}
.panel h3{font-size:14px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--line-soft);}

/* stat row */
.stat-row{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); margin-bottom:18px;}
.stat{background:var(--panel); padding:16px 14px;}
.stat .n{font-size:24px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat .l{font-size:11px; color:var(--ink-soft); margin-top:3px;}
.stat.pass .n{color:var(--green);}
.stat.fail .n{color:var(--red);}
.stat.pending .n{color:var(--amber);}

.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;} .stat-row{grid-template-columns:repeat(3,1fr);}}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:10px;}
.bar-chart .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-chart .seg{width:100%; max-width:34px; display:flex; flex-direction:column-reverse;}
.bar-chart .seg div{width:100%;}
.bar-chart .lbl{font-size:10.5px; color:var(--ink-soft); margin-top:6px;}
.bar-chart .val{font-size:10px; color:var(--ink-soft); margin-bottom:3px;}

.activity-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
.activity-item:last-child{border-bottom:none;}
.activity-item .dot{width:6px;height:6px; border-radius:50%; background:var(--steel); margin-top:6px; flex-shrink:0;}
.activity-item .t{color:#8a97a1; font-size:11px; white-space:nowrap;}

/* tables */
.data-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
  padding:9px 12px; border-bottom:1px solid var(--line); background:var(--gray-bg);
}
.data-table td{padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:13px; vertical-align:middle;}
.data-table tr:hover td{background:#f9fafb;}
.data-table .num{font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:12.5px;}
.empty-row td{text-align:center; color:#8a97a1; padding:30px; font-size:13px;}

.badge{display:inline-block; padding:2px 8px; border-radius:2px; font-size:11px; font-weight:600; letter-spacing:.02em;}
.badge.pass{background:var(--green-bg); color:var(--green);}
.badge.fail{background:var(--red-bg); color:var(--red);}
.badge.pending{background:var(--amber-bg); color:var(--amber);}
.badge.draft{background:var(--gray-bg); color:var(--ink-soft);}
.badge.approved{background:var(--green-bg); color:var(--green);}
.badge.role{background:#e7eef4; color:var(--steel-dark);}

.toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.toolbar input,.toolbar select{padding:8px 10px; border:1px solid var(--line); border-radius:2px; background:#fff;}
.toolbar input{min-width:180px;}
.icon-btn{background:transparent; border:1px solid var(--line); border-radius:2px; padding:5px 9px; cursor:pointer; font-size:12px; color:var(--ink-soft);}
.icon-btn:hover{background:var(--gray-bg); color:var(--ink);}

/* forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:700px){.form-grid,.form-grid.g3,.form-grid.g4{grid-template-columns:1fr;}}
.f{display:flex; flex-direction:column; gap:5px;}
.f label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
.f label .req{color:var(--red);}
.f input,.f select,.f textarea{padding:8px 10px; border:1px solid var(--line); border-radius:2px; background:#fff; width:100%;}
.f textarea{resize:vertical; min-height:60px;}
.f .err{color:var(--red); font-size:11.5px;}
.f input.invalid,.f select.invalid{border-color:var(--red); background:var(--red-bg);}

.modal-bg{display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:50; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 20px;}
.modal-bg.active{display:flex;}
.modal{background:#fff; width:640px; max-width:100%; border-radius:2px; padding:24px 26px 26px;}
.modal h3{font-size:16px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
.modal .close{cursor:pointer; color:#8a97a1; font-size:20px; line-height:1;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft);}

/* wizard */
.steps{display:flex; gap:2px; margin-bottom:22px; flex-wrap:wrap;}
.steps .step{flex:1; min-width:90px; text-align:center; padding:8px 4px; font-size:11px; background:var(--gray-bg); color:var(--ink-soft); border-bottom:3px solid var(--line);}
.steps .step.active{background:#e7eef4; color:var(--steel-dark); border-bottom-color:var(--steel); font-weight:600;}
.steps .step.done{color:var(--green); border-bottom-color:var(--green);}

.obs-table input{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:2px;}
.obs-table td{padding:6px;}
.add-row-btn{margin-top:8px; font-size:12px;}

.calc-out{background:var(--gray-bg); padding:12px 14px; border-radius:2px; font-family:var(--mono); font-size:12.5px; display:grid; grid-template-columns:1fr 1fr; gap:6px 16px;}
.calc-out .k{color:var(--ink-soft);}

.wizard-nav{display:flex; justify-content:space-between; margin-top:22px; padding-top:16px; border-top:1px solid var(--line-soft);}

/* report doc */
.report-doc{background:#fff; padding:40px 44px; font-size:13px; color:#1a1a1a;}
.report-doc h1{font-size:20px; text-align:center; margin-bottom:2px;}
.report-doc .rd-sub{text-align:center; color:#666; font-size:12px; margin-bottom:22px;}
.report-doc h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1.5px solid #1a1a1a; padding-bottom:5px; margin:22px 0 10px;}
.report-doc table{margin-bottom:6px;}
.report-doc td,.report-doc th{border:1px solid #ccc; padding:6px 9px; font-size:12px;}
.report-doc th{background:#f2f2f2; text-align:left;}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:4px 20px; font-size:12.5px;}
.kv div span{color:#666;}
.final-decision{margin-top:18px; padding:14px; text-align:center; font-size:16px; font-weight:700; border:2px solid;}
.final-decision.pass{border-color:var(--green); color:var(--green); background:var(--green-bg);}
.final-decision.fail{border-color:var(--red); color:var(--red); background:var(--red-bg);}
.sig-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-top:30px;}
.sig-box{border-top:1px solid #999; padding-top:6px; font-size:11.5px; color:#555;}

.wf-track{display:flex; align-items:center; gap:0; margin:6px 0 20px;}
.wf-node{flex:1; text-align:center; position:relative;}
.wf-node .dot{width:22px; height:22px; border-radius:50%; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:11px; font-weight:700;}
.wf-node.done .dot{background:var(--green);}
.wf-node.current .dot{background:var(--steel);}
.wf-node .lbl{font-size:11px; color:var(--ink-soft);}
.wf-node:not(:last-child)::after{content:""; position:absolute; top:11px; left:calc(50% + 16px); right:calc(-50% + 16px); height:2px; background:var(--line);}
.wf-node.done:not(:last-child)::after{background:var(--green);}

.help-text{font-size:11.5px; color:#8a97a1; margin-top:2px;}
.section-note{background:var(--amber-bg); color:#8a5c14; padding:10px 12px; border-radius:2px; font-size:12px; margin-bottom:16px;}
.empty-state{text-align:center; padding:50px 20px; color:#8a97a1;}
.empty-state .big{font-size:15px; color:var(--ink-soft); margin-bottom:6px;}
@media print{
  .no-print{display:none !important;}
  #app{display:block !important;}
  .sidebar{display:none !important;}
  .main{padding:0; max-width:none;}
  body{background:#fff;}
}
.audit-diff{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand"><span class="mark"></span><h1>Legito</h1></div>
    <div class="login-sub">OIML R76 Weighing Instrument Calibration Management</div>
    <div class="field">
      <label>Username</label>
      <input id="loginUser" placeholder="e.g. admin">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••">
    </div>
    <button class="btn block" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="loginErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="sidebar no-print">
    <div class="side-brand"><span class="mark"></span><span>Legito</span></div>
    <div class="side-nav" id="sideNav"></div>
    <div class="side-user">
      <div class="u-name" id="curUserName"></div>
      <div class="u-role" id="curUserRole"></div>
      <button onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<div class="modal-bg no-print" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* =========================================================================
   Legito — OIML R76 Calibration Lab Management
   Single-file app. Data persisted in localStorage under key 'Legito_db'.
   ========================================================================= */

const DB_KEY = 'Legito_db';
const TEST_TYPES = [
  {id:'visual', name:'Visual Examination'},
  {id:'zero', name:'Zero Setting Test'},
  {id:'span', name:'Span Test'},
  {id:'repeat', name:'Repeatability Test'},
  {id:'eccentric', name:'Eccentric Loading Test'},
  {id:'discrimination', name:'Discrimination Test'},
  {id:'warmup', name:'Warm-up Test'},
  {id:'stability', name:'Stability Test'},
  {id:'environmental', name:'Environmental Tests'},
  {id:'software', name:'Software Examination'},
];
const ROLES = ['Admin','Laboratory Engineer','Reviewer','Approver'];
const WF_STAGES = ['Draft','Engineer Completed','Reviewer','Approver','Approved'];

// Simplified OIML R76 MPE table: MPE in units of "e", by load band (in e) and accuracy class.
// initial verification values; in-service = x2. This is a configurable starting point —
// verify against your current OIML R76 edition / national regulation before formal use.
const DEFAULT_MPE_TABLE = [
  {accuracyClass:'I',    band:'0–50,000e',     minE:0,     maxE:50000,  mpeE:0.5},
  {accuracyClass:'I',    band:'50,000–200,000e', minE:50000, maxE:200000, mpeE:1.0},
  {accuracyClass:'I',    band:'>200,000e',     minE:200000,maxE:Infinity,mpeE:1.5},
  {accuracyClass:'II',   band:'0–5,000e',      minE:0,     maxE:5000,   mpeE:0.5},
  {accuracyClass:'II',   band:'5,000–20,000e', minE:5000,  maxE:20000,  mpeE:1.0},
  {accuracyClass:'II',   band:'>20,000e',      minE:20000, maxE:Infinity,mpeE:1.5},
  {accuracyClass:'III',  band:'0–500e',        minE:0,     maxE:500,    mpeE:0.5},
  {accuracyClass:'III',  band:'500–2,000e',    minE:500,   maxE:2000,   mpeE:1.0},
  {accuracyClass:'III',  band:'>2,000e',       minE:2000,  maxE:Infinity,mpeE:1.5},
  {accuracyClass:'IIII', band:'0–50e',         minE:0,     maxE:50,     mpeE:0.5},
  {accuracyClass:'IIII', band:'50–200e',       minE:50,    maxE:200,    mpeE:1.0},
  {accuracyClass:'IIII', band:'>200e',         minE:200,   maxE:Infinity,mpeE:1.5},
];

let DB = null;
let CUR_USER = null;
let ROUTE = {page:'dashboard', params:{}};

// ---------------- persistence ----------------
function loadDB(){
  let raw = null;
  try{ raw = localStorage.getItem(DB_KEY); }catch(e){}
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return seedDB();
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ console.warn('persist failed', e); }
}
function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,9); }
function nowStr(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }

function seedDB(){
  const db = {
    users:[
      {id:uid('u'), username:'admin', password:'admin123', name:'Anand', role:'Admin'},
      {id:uid('u'), username:'engineer', password:'eng123', name:'Rohit', role:'Laboratory Engineer'},
      {id:uid('u'), username:'reviewer', password:'rev123', name:'Arun', role:'Reviewer'},
      {id:uid('u'), username:'approver', password:'app123', name:'Bharath', role:'Approver'},
    ],
    manufacturers:[
      {id:uid('mf'), name:'Precision Scales Ltd', address:'14 Foundry Rd, Coventry, UK', contact:'James Ellwood', phone:'+44 24 7601 2233', email:'sales@precisionscales.co.uk', country:'United Kingdom', license:'PSL-2019-441'},
      {id:uid('mf'), name:'Meissen Wägetechnik GmbH', address:'Industriestrasse 9, Meissen, Germany', contact:'Greta Fuchs', phone:'+49 3521 40021', email:'info@meissen-waeg.de', country:'Germany', license:'MWG-2011-07'},
    ],
    instruments:[],
    reports:[],
    auditLog:[],
    settings:{ mpeTable: DEFAULT_MPE_TABLE, ruleVersion:'OIML R76-1:2006 (ed. 2006)', labs:['Central Metrology Lab', 'Mobile Verification Unit 2'] },
  };
  db.instruments.push({
    id:uid('in'), manufacturerId: db.manufacturers[0].id, name:'Precision Bench Balance PB-620', type:'Non-automatic weighing instrument',
    model:'PB-620', serial:'SN-2024-08831', capacity:'620', minCapacity:'0.02', e:'0.01', accuracyClass:'II',
    display:'Digital LCD', power:'AC/Battery', softwareVersion:'v3.2.1', firmwareVersion:'FW-1.0.7',
  });
  db.instruments.push({
    id:uid('in'), manufacturerId: db.manufacturers[1].id, name:'Platform Scale WT-3000', type:'Non-automatic weighing instrument',
    model:'WT-3000', serial:'SN-2023-11290', capacity:'3000', minCapacity:'1', e:'0.5', accuracyClass:'III',
    display:'Digital LED', power:'AC', softwareVersion:'v2.0.0', firmwareVersion:'FW-2.4.0',
  });
  return db;
}

function logAction(action, detail){
  DB.auditLog.unshift({id:uid('a'), userId:CUR_USER?CUR_USER.id:null, userName:CUR_USER?CUR_USER.name:'System', action, detail, time:nowStr()});
  if(DB.auditLog.length>500) DB.auditLog.length=500;
}

// ---------------- auth ----------------
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const user = DB.users.find(x=>x.username===u && x.password===p);
  const errEl = document.getElementById('loginErr');
  if(!user){ errEl.textContent='Incorrect username or password.'; return; }
  errEl.textContent='';
  CUR_USER = user;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  logAction('Login', user.name+' signed in');
  saveDB();
  navigate('dashboard');
}
function doLogout(){
  logAction('Logout', CUR_USER.name+' signed out');
  saveDB();
  CUR_USER=null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

// ---------------- nav ----------------
const NAV = [
  {grp:'Overview', items:[{id:'dashboard', label:'Dashboard'}]},
  {grp:'Registry', items:[{id:'manufacturers', label:'Manufacturers'},{id:'instruments', label:'Instruments'}]},
  {grp:'Testing', items:[{id:'newreport', label:'New Report'},{id:'repository', label:'Report Repository'}]},
  {grp:'Oversight', items:[{id:'audit', label:'Audit Trail'}]},
  {grp:'Admin', items:[{id:'settings', label:'Settings', adminOnly:true}]},
];
function renderNav(){
  const el=document.getElementById('sideNav'); el.innerHTML='';
  NAV.forEach(g=>{
    const items = g.items.filter(it=> !it.adminOnly || CUR_USER.role==='Admin');
    if(!items.length) return;
    const h=document.createElement('div'); h.className='grp'; h.textContent=g.grp; el.appendChild(h);
    items.forEach(it=>{
      const a=document.createElement('a');
      a.textContent=it.label;
      a.className = ROUTE.page===it.id ? 'active':'';
      a.onclick=()=>navigate(it.id);
      el.appendChild(a);
    });
  });
  document.getElementById('curUserName').textContent=CUR_USER.name;

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function pageDashboard(){
  const reports = DB.reports;
  const inProgress = reports.filter(r=>r.status!=='Approved').length;
  const completed = reports.filter(r=>r.status==='Approved').length;
  const pendingReview = reports.filter(r=>r.status==='Engineer Completed'||r.status==='Reviewer').length;
  const failed = reports.filter(r=>r.finalDecision==='FAIL').length;
  const passed = reports.filter(r=>r.finalDecision==='PASS').length;

  // monthly stats last 6 months
  const months=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+'-'+d.getMonth(), label:d.toLocaleDateString('en-GB',{month:'short'}), pass:0, fail:0});
  }
  reports.forEach(r=>{
    const d=new Date(r.createdAt);
    const key=d.getFullYear()+'-'+d.getMonth();
    const mo=months.find(m=>m.key===key);
    if(mo){ if(r.finalDecision==='PASS') mo.pass++; else if(r.finalDecision==='FAIL') mo.fail++; }
  });
  const maxVal = Math.max(1, ...months.map(m=>m.pass+m.fail));

  const recent = DB.auditLog.slice(0,8);

  return `
  <div class="page-head">
    <div><h2>Dashboard</h2><div class="sub">Overview of calibration activity</div></div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="n">${DB.instruments.length}</div><div class="l">Total Instruments</div></div>
    <div class="stat pending"><div class="n">${inProgress}</div><div class="l">Tests in Progress</div></div>
    <div class="stat pass"><div class="n">${completed}</div><div class="l">Completed Reports</div></div>
    <div class="stat pending"><div class="n">${pendingReview}</div><div class="l">Pending Reviews</div></div>
    <div class="stat fail"><div class="n">${failed}</div><div class="l">Failed Tests</div></div>
    <div class="stat"><div class="n">${reports.length}</div><div class="l">Total Reports</div></div>
  </div>
  <div class="two-col">
    <div class="panel">
      <h3>Monthly Statistics — Pass vs Fail</h3>
      <div class="bar-chart">
        ${months.map(m=>{
          const h = 110;
          const passH = m.pass/maxVal*h, failH=m.fail/maxVal*h;
          return `<div class="col">
            <div class="seg" style="height:${h}px; justify-content:flex-end;">
              <div style="height:${failH}px;background:var(--red);" title="Fail: ${m.fail}"></div>
              <div style="height:${passH}px;background:var(--green);" title="Pass: ${m.pass}"></div>
            </div>
            <div class="lbl">${m.label}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--ink-soft);">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--green);margin-right:5px;"></span>Pass (${passed})</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--red);margin-right:5px;"></span>Fail (${failed})</span>
      </div>
    </div>
    <div class="panel">
      <h3>Recent Activity</h3>
      <div id="recentActivity">
      ${recent.length? recent.map(a=>`
        <div class="activity-item"><div class="dot"></div>
          <div style="flex:1;"><div>${esc(a.action)}</div><div style="color:#8a97a1;">${esc(a.detail||'')}</div></div>
          <div class="t">${fmtDateTime(a.time)}</div>
        </div>`).join('') : '<div class="empty-state" style="padding:20px;">No activity yet</div>'}
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   CALCULATION / COMPLIANCE ENGINE
   ========================================================================= */
function getMPEBand(accuracyClass, loadInE){
  const table = DB.settings.mpeTable;
  return table.find(r=> r.accuracyClass===accuracyClass && loadInE>=r.minE && loadInE<r.maxE);
}
// observed = measured value, nominal = applied/reference value, eValue = instrument's e, inService = bool
function calcTestRow(nominal, observed, accuracyClass, eValue, inService){
  nominal = parseFloat(nominal); observed = parseFloat(observed); eValue = parseFloat(eValue);
  if(isNaN(nominal)||isNaN(observed)||isNaN(eValue)||eValue<=0){
    return {valid:false};
  }
  const observedError = observed - nominal; // in same units
  const loadInE = Math.abs(nominal)/eValue;
  const band = getMPEBand(accuracyClass, loadInE);
  const mult = inService?2:1;
  const mpeInE = band ? band.mpeE*mult : null;
  const mpeValue = mpeInE!==null ? mpeInE*eValue : null;
  const absError = Math.abs(observedError);
  const pass = mpeValue!==null ? absError <= mpeValue : null;
  return {valid:true, observedError, absError, loadInE, mpeInE, mpeValue, pass, band: band?band.band:'—'};
}

      <textarea onchange="WIZ.tests['${t.id}'].remark=this.value" placeholder="Record findings for ${esc(t.name.toLowerCase())}...">${esc(st.remark)}</textarea>
    </div>
    `}
    <div class="f" style="margin-top:14px;">
      <label>Engineer Remark</label>
      <textarea onchange="WIZ.tests['${t.id}'].engRemark=this.value" placeholder="Optional notes...">${esc(st.engRemark||'')}</textarea>
    </div>
  </div>`;
}
function addObs(testId){ WIZ.tests[testId].observations.push({nominal:'',observed:''}); render(); }
function removeObs(testId, idx){ WIZ.tests[testId].observations.splice(idx,1); if(!WIZ.tests[testId].observations.length) WIZ.tests[testId].observations.push({nominal:'',observed:''}); render(); }
function updateObs(testId, idx, field, val){ WIZ.tests[testId].observations[idx][field]=val; render(); }

function computeOverallResult(){
  const inst = DB.instruments.find(i=>i.id===WIZ.instrumentId);
  let anyFail=false, anyChecked=false;
  TEST_TYPES.forEach(t=>{
    const st=WIZ.tests[t.id]; if(!st) return;
    st.observations.forEach(o=>{
      if(o.nominal==='' || o.observed==='') return;
      const c = inst? calcTestRow(o.nominal,o.observed,inst.accuracyClass,inst.e,WIZ.inService):{valid:false};
      if(c.valid && c.pass!==null){ anyChecked=true; if(!c.pass) anyFail=true; }
    });
  });
  return anyChecked ? (anyFail?'FAIL':'PASS') : 'INCOMPLETE';
}
function renderReviewStep(){
  const inst = DB.instruments.find(i=>i.id===WIZ.instrumentId);
  const result = computeOverallResult();
  // validation checks
  const errors=[];
  if(!WIZ.instrumentId) errors.push('No instrument selected.');
  if(!WIZ.lab.temperature || WIZ.lab.temperature<15 || WIZ.lab.temperature>30) errors.push('Temperature is outside the accepted 15–30°C environmental range.');
  if(!WIZ.lab.humidity || WIZ.lab.humidity<20 || WIZ.lab.humidity>80) errors.push('Humidity is outside the accepted 20–80%RH environmental range.');
  let hasAnyObservation=false;
  TEST_TYPES.forEach(t=>{
    const st=WIZ.tests[t.id];
    if(st) st.observations.forEach(o=>{ if(o.nominal!=='' && o.observed!=='') hasAnyObservation=true; });
  });
  if(!hasAnyObservation) errors.push('No test observations recorded across any module.');

  return `
  <div class="panel">
    <h3>Review Summary</h3>
    <div class="kv">
      <div><span>Instrument:</span> ${inst?esc(inst.name)+' ('+esc(inst.serial)+')':'—'}</div>
      <div><span>Laboratory:</span> ${esc(WIZ.lab.laboratory)}</div>
      <div><span>Engineer:</span> ${esc(WIZ.lab.engineer)}</div>
      <div><span>Date:</span> ${esc(WIZ.lab.date)}</div>
      <div><span>Verification type:</span> ${WIZ.inService?'In-Service':'Initial'}</div>
      <div><span>Overall result:</span> <span class="badge ${result==='PASS'?'pass':result==='FAIL'?'fail':'pending'}">${result}</span></div>
    </div>
  </div>
  ${errors.length? `<div class="panel"><h3>Validation Engine</h3>${errors.map(e=>`<div class="section-note">⚠ ${esc(e)}</div>`).join('')}</div>` : `<div class="panel"><h3>Validation Engine</h3><div class="section-note" style="background:var(--green-bg);color:var(--green);">✓ All checks passed — missing values, ranges, and environmental limits look correct.</div></div>`}
  <div class="panel">
    <h3>Engineer Remarks</h3>
    <div class="f"><textarea onchange="WIZ.remarksEngineer=this.value" placeholder="Overall summary remarks for this report...">${esc(WIZ.remarksEngineer)}</textarea></div>
  </div>`;
}

function wizNext(){
  if(WIZ.step===0){
    const sel=document.getElementById('wiz_instrument');
    if(sel) WIZ.instrumentId=sel.value;
    if(!WIZ.instrumentId){ alert('Please select an instrument to continue.'); return; }
  }
  if(WIZ.step===1){
    WIZ.lab.laboratory=document.getElementById('lb_lab').value;
    WIZ.lab.engineer=document.getElementById('lb_eng').value;
    WIZ.lab.date=document.getElementById('lb_date').value;
    WIZ.lab.temperature=document.getElementById('lb_temp').value;
    WIZ.lab.humidity=document.getElementById('lb_hum').value;
    WIZ.lab.pressure=document.getElementById('lb_pres').value;
    WIZ.lab.voltage=document.getElementById('lb_volt').value;
    WIZ.lab.duration=document.getElementById('lb_dur').value;
    WIZ.inService = document.getElementById('lb_inservice').value==='true';
    if(!WIZ.lab.date || WIZ.lab.temperature===''||WIZ.lab.humidity===''){ alert('Please complete all required lab condition fields.'); return; }

  WIZ.step++;
  render();
}
function wizPrev(){ WIZ.step--; render(); }
function cancelWizard(){ if(confirm('Discard this report draft?')){ WIZ=null; navigate('repository'); } }

function submitReport(){
  const inst = DB.instruments.find(i=>i.id===WIZ.instrumentId);
  if(!inst){ alert('No instrument selected.'); return; }
  const result = computeOverallResult();
  const id = uid('rep');
  const report = {
    id,
    reportNo: 'RPT-'+new Date().getFullYear()+'-'+String(DB.reports.length+1).padStart(4,'0'),
    instrumentId: inst.id,
    manufacturerId: inst.manufacturerId,

    remarksEngineer: WIZ.remarksEngineer,
    remarksReviewer:'',
    remarksApprover:'',

}

function renderTestReportBlock(r,t,inst){
  const st = r.tests[t.id];
  if(!st) return '';
  const needsCalc = !['visual','software','environmental'].includes(t.id);
  const hasData = needsCalc ? st.observations.some(o=>o.nominal!=='' && o.observed!=='') : (st.remark && st.remark.trim());
  if(!hasData && !(st.engRemark && st.engRemark.trim())) return '';
  let body='';
  if(needsCalc){
    const validRows = st.observations.filter(o=>o.nominal!=='' && o.observed!=='');
    if(validRows.length){
      body = `<table><thead><tr><th>Nominal</th><th>Observed</th><th>Error</th><th>MPE</th><th>Result</th></tr></thead><tbody>
      ${validRows.map(o=>{
        const c = calcTestRow(o.nominal,o.observed,inst.accuracyClass,inst.e,r.inService);
        return `<tr><td>${esc(o.nominal)}</td><td>${esc(o.observed)}</td><td>${c.valid?c.observedError.toFixed(4):'—'}</td><td>${c.valid&&c.mpeValue!==null?c.mpeValue.toFixed(4):'—'}</td><td>${c.valid&&c.pass!==null?(c.pass?'PASS':'FAIL'):'—'}</td></tr>`;
      }).join('')}
      </tbody></table>`;
    }
  } else if(st.remark){
    body = `<div style="margin-bottom:6px;">${esc(st.remark)}</div>`;
  }
  return `<div style="margin-bottom:14px;"><strong style="font-size:12.5px;">${esc(t.name)}</strong>${body}${st.engRemark?`<div style="color:#666;font-size:11.5px;">Note: ${esc(st.engRemark)}</div>`:''}</div>`;
}

function canUserAdvance(r){
  if(r.status==='Approved') return false;
  const role = CUR_USER.role;
  if(r.status==='Engineer Completed' && (role==='Reviewer'||role==='Admin')) return true;
  if(r.status==='Reviewer' && (role==='Approver'||role==='Admin')) return true;
  return false;
}
function nextActionLabel(status){
  if(status==='Engineer Completed') return 'Send for Review';
  if(status==='Reviewer') return 'Approve Report';
  return 'Advance';
}
function openAdvanceModal(id){
  const r = DB.reports.find(x=>x.id===id);
  const nextStage = r.status==='Engineer Completed' ? 'Reviewer' : 'Approved';
  const roleLabel = r.status==='Engineer Completed' ? 'Reviewer' : 'Approver';
  openModal(`
    <h3>${nextActionLabel(r.status)} <span class="close" onclick="closeModal()">&times;</span></h3>
    <p style="font-size:13px;color:var(--ink-soft);">This will move report ${esc(r.reportNo)} to stage: <strong>${esc(nextStage)}</strong>.</p>
    <div class="f"><label>${esc(roleLabel)} Remarks</label><textarea id="adv_remark" placeholder="Add your remarks..."></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="advanceReport('${id}')">Confirm</button>
    </div>
  `);
}
function advanceReport(id){
  const r = DB.reports.find(x=>x.id===id);
  const remark = document.getElementById('adv_remark').value.trim();
  if(r.status==='Engineer Completed'){
    r.status='Reviewer'; r.remarksReviewer=remark; r.reviewedBy=CUR_USER.name;
  } else if(r.status==='Reviewer'){
    r.status='Approved'; r.remarksApprover=remark; r.approvedBy=CUR_USER.name;
  }
  r.history.push({status:r.status, by:CUR_USER.name, time:nowStr()});
  logAction('Report status changed', r.reportNo+' → '+r.status);
  saveDB(); closeModal(); render();
}

function exportWord(id){

  logAction('Report exported', r.reportNo+' (Word)');

    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveUser('${id||''}')">Save</button>
    </div>
  `);
}
function saveUser(id){
  const name=document.getElementById('us_name').value.trim();
  const username=document.getElementById('us_user').value.trim();
  const password=document.getElementById('us_pass').value;
  const role=document.getElementById('us_role').value;
  if(!name||!username||!password){ document.querySelector('#us_err .err').textContent='All fields are required.'; return; }
  if(DB.users.some(u=>u.username===username && u.id!==id)){ document.querySelector('#us_err .err').textContent='Username already exists.'; return; }
  if(id){ Object.assign(DB.users.find(x=>x.id===id), {name,username,password,role}); logAction('User updated', name); }
  else{ DB.users.push({id:uid('u'), name,username,password,role}); logAction('User created', name+' ('+role+')'); }
  saveDB(); closeModal(); render();
}
function deleteUser(id){
  const u=DB.users.find(x=>x.id===id);
  if(!confirm('Delete user "'+u.name+'"?')) return;
  DB.users=DB.users.filter(x=>x.id!==id);
  logAction('User deleted', u.name);
  saveDB(); render();
}

/* =========================================================================
   INIT
   ========================================================================= */
DB = loadDB();
saveDB();
document.getElementById('loginPass').addEventListener('keyup', e=>{ if(e.key==='Enter') doLogin(); });
</script>
